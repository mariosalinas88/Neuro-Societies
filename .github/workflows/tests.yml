name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run verification script
      run: |
        python verify.py > verify_output.log 2>&1 || (tail -200 verify_output.log && exit 1)
        cat verify_output.log
    
    - name: Run basic tests
      run: |
        python tests/test_basic.py > test_output.log 2>&1 || (tail -200 test_output.log && exit 1)
        cat test_output.log
    
    - name: Run quick simulation
      run: |
        python run.py --steps 5 --populationscale tiny > simulation_output.log 2>&1 || (tail -200 simulation_output.log && exit 1)
        cat simulation_output.log
