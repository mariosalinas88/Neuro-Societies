name: Profile Society Simulation Runs

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'run_profile_societies.py'
      - 'model.py'
      - 'profiles.json'
      - 'requirements.txt'
      - '.github/workflows/profile-society-runs.yml'

jobs:
  profile-society-runs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run profile society simulations
      run: |
        python run_profile_societies.py > profile_society_runs.log 2>&1 || (tail -240 profile_society_runs.log && exit 1)
        cat profile_society_runs.log

    - name: Upload profile society results
      uses: actions/upload-artifact@v4
      with:
        name: profile-society-results
        path: |
          profile_society_runs.log
          simulation_results/profile_societies/
